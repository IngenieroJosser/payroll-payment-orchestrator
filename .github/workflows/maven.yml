name: Backend quality gate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 / Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw --version

      - name: Unit, architecture and integration tests
        run: ./mvnw -B -ntp clean verify

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
            target/bom.json
            target/bom.xml

  container:
    name: Production container build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build non-root image
        run: docker build --pull --tag payroll-payment-orchestrator:${{ github.sha }} .
