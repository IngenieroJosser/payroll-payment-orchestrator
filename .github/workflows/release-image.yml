name: Signed container release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Verify, scan, sign and attest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify source and migrations
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build image locally for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable scan reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          scan_ref="$(printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS" | head -n 1)"
          test -n "$scan_ref"
          echo "scan_ref=$scan_ref" >> "$GITHUB_OUTPUT"

      - name: Reject high or critical container vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.image.outputs.scan_ref }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false

      - name: Push immutable image tags
        id: push
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag" && docker push "$tag"
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"

          scan_ref='${{ steps.image.outputs.scan_ref }}'
          image_name="${scan_ref%:*}"
          repo_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$scan_ref" 2>/dev/null || true)"
          if [ -n "$repo_digest" ]; then
            digest="${repo_digest#*@}"
          else
            digest="$(docker buildx imagetools inspect "$scan_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          fi
          case "$digest" in sha256:*) ;; *) echo 'Unable to resolve pushed image digest' >&2; exit 1 ;; esac
          echo "image=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign image with GitHub OIDC identity
        run: cosign sign --yes "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Generate and publish build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
