name: Check branch flow

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check-source:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Validating flow: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" == "main" && "${SOURCE_BRANCH}" != "develop" ]]; then
            echo "::error::Only develop may be merged into main."
            exit 1
          fi

          if [[ "${TARGET_BRANCH}" == "develop" && ! "${SOURCE_BRANCH}" =~ ^feature/ ]]; then
            echo "::error::Only feature/* branches may be merged into develop."
            exit 1
          fi
