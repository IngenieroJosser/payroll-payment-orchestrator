name: Check Branch Flow and Build

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-source-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate branch source
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Evaluando flujo: $SOURCE_BRANCH -> $TARGET_BRANCH"

          # REGLA 1: Solo develop -> main
          if [ "$TARGET_BRANCH" = "main" ] && [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "::error::Flujo inválido. Solo se permite merge a 'main' desde 'develop'."
            exit 1
          fi

          # REGLA 2: Solo feature/* -> develop
          if [ "$TARGET_BRANCH" = "develop" ]; then
            if [[ ! "$SOURCE_BRANCH" =~ ^feature/ ]]; then
              echo "::error::Flujo inválido. Solo se permiten merges a 'develop' desde ramas 'feature/*'."
              exit 1
            fi
          fi

          echo "Flujo de ramas válido."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven (skipping integration tests)
        run: mvn clean install -DskipITs