spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:5}
      connection-timeout: 10000
      validation-timeout: 3000
      leak-detection-threshold: ${SPRING_DATASOURCE_LEAK_DETECTION_MS:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    requested-heartbeat: 30s
    connection-timeout: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:20}
        concurrency: ${SPRING_RABBITMQ_LISTENER_CONCURRENCY:3}
        max-concurrency: ${SPRING_RABBITMQ_LISTENER_MAX_CONCURRENCY:12}
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 30000ms

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  deployment:
    payment-execution-enabled: ${APP_PAYMENT_EXECUTION_ENABLED:false}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    jwt-issuer: ${APP_JWT_ISSUER:payroll-payment-orchestrator}
    jwt-audience: ${APP_JWT_AUDIENCE:payroll-api}
    require-idempotency-key: true
    ip-allowlist-enabled: ${APP_IP_ALLOWLIST_ENABLED:true}
    ip-allowlist: ${APP_IP_ALLOWLIST}
    trusted-proxy-addresses: ${APP_TRUSTED_PROXY_ADDRESSES}
    mtls-enabled: ${APP_MTLS_ENABLED:true}
    mtls-allowed-subjects: ${APP_MTLS_ALLOWED_SUBJECTS}
  crypto:
    encryption-key: ${APP_ENCRYPTION_KEY}
    hash-key: ${APP_HASH_KEY}
  bootstrap:
    enabled: false
  bank:
    sandbox-fallback-enabled: false
    governance:
      allow-uncertified-providers: false
      certified-providers: ${APP_BANK_CERTIFIED_PROVIDERS:}
  outbound:
    allow-http: false
    allow-private-networks: false
    allowed-hosts: ${APP_OUTBOUND_ALLOWED_HOSTS}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.corvian.payroll_payment_orchestrator: INFO
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
