spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

logging:
  level:
    root: INFO
    com.corvian.payroll_payment_orchestrator: INFO


app:
  security:
    jwt-secret: ${APP_JWT_SECRET}
    require-idempotency-key: true
    ip-allowlist-enabled: ${APP_IP_ALLOWLIST_ENABLED:true}
    ip-allowlist: ${APP_IP_ALLOWLIST}
    mtls-enabled: ${APP_MTLS_ENABLED:true}
  crypto:
    encryption-key: ${APP_ENCRYPTION_KEY}
    hash-key: ${APP_HASH_KEY}
  bank:
    provider: ${APP_BANK_PROVIDER:rest}
