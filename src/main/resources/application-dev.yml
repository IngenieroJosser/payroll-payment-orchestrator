spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payroll-payment-orchestrator
    username: payroll_user
    password: payroll_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: payroll_user
    password: payroll_password

logging:
  level:
    root: INFO
    com.corvian.payroll_payment_orchestrator: DEBUG
