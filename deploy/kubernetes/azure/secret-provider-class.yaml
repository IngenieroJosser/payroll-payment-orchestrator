# Requires Azure Workload Identity and the Secrets Store CSI Driver.
# Replace tenantId, keyvaultName, client-id and object names before applying.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payroll-orchestrator-key-vault
spec:
  provider: azure
  secretObjects:
    - secretName: payroll-orchestrator-secrets
      type: Opaque
      data:
        - objectName: payroll-jwt-secret
          key: APP_JWT_SECRET
        - objectName: payroll-encryption-key
          key: APP_ENCRYPTION_KEY
        - objectName: payroll-previous-encryption-key
          key: APP_PREVIOUS_ENCRYPTION_KEY
        - objectName: payroll-hash-key
          key: APP_HASH_KEY
        - objectName: payroll-postgres-password
          key: SPRING_DATASOURCE_PASSWORD
        - objectName: payroll-rabbitmq-password
          key: SPRING_RABBITMQ_PASSWORD
        - objectName: bank-acme-api-token
          key: BANK_ACME_API_TOKEN
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: replace-with-workload-identity-client-id
    keyvaultName: replace-with-key-vault-name
    tenantId: replace-with-azure-tenant-id
    objects: |
      array:
        - |
          objectName: payroll-jwt-secret
          objectType: secret
        - |
          objectName: payroll-encryption-key
          objectType: secret
        - |
          objectName: payroll-previous-encryption-key
          objectType: secret
        - |
          objectName: payroll-hash-key
          objectType: secret
        - |
          objectName: payroll-postgres-password
          objectType: secret
        - |
          objectName: payroll-rabbitmq-password
          objectType: secret
        - |
          objectName: bank-acme-api-token
          objectType: secret
